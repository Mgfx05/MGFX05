# Save this file as: .github/workflows/snake.yml
# inside the special repo named exactly like your GitHub username
# (e.g. github.com/Mgfx05/Mgfx05)
#
# Then go to that repo's "Actions" tab and enable workflows.
# It will generate an animated SVG of your contribution graph
# on an "output" branch, which the README links to.

name: generate-snake-animation

on:
  schedule:
    - cron: "0 0 * * *"   # regenerate once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Mgfx05   # <-- replace with your username
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
