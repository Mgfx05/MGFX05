<svg viewBox="0 0 1000 40" xmlns="http://www.w3.org/2000/svg" width="100%" height="40">
  <defs>
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path d="M20,20 L980,20" stroke="url(#traceGrad)" stroke-width="2" stroke-dasharray="6 8" fill="none" opacity="0.55"/>

  <circle cx="100" cy="20" r="5" fill="#00F5FF">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="20" r="5" fill="#7C3AED">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="460" cy="20" r="5" fill="#FFB020">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="20" r="5" fill="#00F5FF">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="20" r="5" fill="#7C3AED">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="20" r="5" fill="#FFB020">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <circle r="6" fill="#F0F6FC" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M20,20 L980,20"/>
  </circle>
</svg>
